apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: infra
spec:
  interval: 10m
  releaseName: kyverno-policies
  chartRef:
    kind: OCIRepository
    name: kyverno-policies
    namespace: flux-system
  dependsOn:
    - name: kyverno
      namespace: infra
  values:
    validationFailureAction: Audit
