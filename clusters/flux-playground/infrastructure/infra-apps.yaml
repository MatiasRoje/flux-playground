apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-apps
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  wait: true
  dependsOn:
    - name: infra-manifests
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/flux-playground/infrastructure/apps
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: infrastructure-versions
        optional: false
