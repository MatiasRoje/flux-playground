apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: dev
  labels:
    app.kubernetes.io/part-of: gateway-api-qa
spec:
  parentRefs:
    - name: dev-gateway
      sectionName: http
    - name: dev-gateway
      sectionName: https
  hostnames:
    - whoami.dev.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin
  namespace: dev
  labels:
    app.kubernetes.io/part-of: gateway-api-qa
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: dev-listeners
      sectionName: admin-http
  hostnames:
    - admin.dev.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: whoami
          port: 80
---
