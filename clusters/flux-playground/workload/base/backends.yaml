apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
        app.kubernetes.io/name: whoami
        app.kubernetes.io/part-of: gateway-api-qa
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0.0
          args:
            - -listen=:5678
            - -text=dev-whoami
          ports:
            - name: http
              containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: dev
  labels:
    app.kubernetes.io/name: whoami
    app.kubernetes.io/part-of: gateway-api-qa
spec:
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-backend
  namespace: dev
  labels:
    app.kubernetes.io/part-of: gateway-api-qa
spec:
  selector:
    app: whoami
  ports:
    - name: grpc
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: tcp-backend
  namespace: dev
  labels:
    app.kubernetes.io/part-of: gateway-api-qa
spec:
  selector:
    app: whoami
  ports:
    - name: tcp
      port: 9000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: tls-backend
  namespace: dev
  labels:
    app.kubernetes.io/part-of: gateway-api-qa
spec:
  selector:
    app: whoami
  ports:
    - name: tls
      port: 9443
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: udp-backend
  namespace: dev
  labels:
    app.kubernetes.io/part-of: gateway-api-qa
spec:
  selector:
    app: whoami
  ports:
    - name: udp
      port: 9001
      protocol: UDP
