apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workload-dev
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  wait: true
  dependsOn:
    - name: monitoring-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/flux-playground/workload/dev
